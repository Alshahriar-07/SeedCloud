<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090B">
  <title>Seed Cloud — Sign in</title>
  <link rel="icon" href="/assets/favicon/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-loading" id="auth-loading">
    <img class="auth-loading-mark" src="/assets/icon.png" alt="Seed Cloud">
    <div class="auth-loading-label">Checking session…</div>
    <div class="auth-loading-spinner"><span class="spinner"></span></div>
  </div>
  <div class="auth-shell">
    <header class="auth-brand">
      <img class="auth-mark" src="/assets/icon.png" alt="Seed Cloud logo">
      <div class="auth-brand-text">
        <span class="auth-name">Seed Cloud</span>
        <span class="auth-sub">Universal cloud storage</span>
      </div>
    </header>

    <main class="auth-panel">
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-intro">Access every file across your cloud accounts.</p>

      <form id="auth-form" novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>

        <div class="auth-forgot">
          <a href="/forgot-password">Forgot password?</a>
        </div>

        <div class="form-error" id="auth-error" hidden></div>

        <button class="btn btn-primary btn-block" id="auth-submit" type="submit">Sign in</button>
      </form>

      <p class="auth-alt">No account? <a href="/signup">Create account</a></p>
    </main>

    <footer class="auth-foot">
      <span class="auth-foot-providers">pCloud · Google Drive · OneDrive · Dropbox · Koofr · Box</span>
      <span class="auth-foot-secure">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Files stay in your providers
      </span>
    </footer>
  </div>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="/vendor/supabase.js"></script>
  <script src="/js/auth-utils.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
