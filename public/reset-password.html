<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090B">
  <title>Seed Cloud — Choose a new password</title>
  <link rel="icon" href="/assets/favicon/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-loading" id="auth-loading">
    <img class="auth-loading-mark" src="/assets/icon.png" alt="Seed Cloud">
    <div class="auth-loading-label">Checking session…</div>
    <div class="auth-loading-spinner"><span class="spinner"></span></div>
  </div>
  <div class="auth-shell">
    <header class="auth-brand">
      <img class="auth-mark" src="/assets/icon.png" alt="Seed Cloud logo">
      <div class="auth-brand-text">
        <span class="auth-name">Seed Cloud</span>
        <span class="auth-sub">Universal cloud storage</span>
      </div>
    </header>

    <main class="auth-panel">
      <form id="reset-form" novalidate>
        <h1 class="auth-title">Choose a new password</h1>
        <p class="auth-intro">Pick a strong password to secure your account.</p>

        <div class="form-field">
          <label for="password">New password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required>
          <div class="field-hint" id="password-hint" hidden></div>
        </div>
        <div class="form-field">
          <label for="confirm-password">Confirm new password</label>
          <input class="input" id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="6" placeholder="Repeat your password" required>
          <div class="field-hint" id="confirm-hint" hidden></div>
        </div>

        <div class="form-error" id="reset-error" hidden></div>

        <button class="btn btn-primary btn-block" id="reset-submit" type="submit">Update password</button>
      </form>

      <div id="reset-invalid" hidden>
        <div class="verify-icon-tile" style="color:var(--warn);background:var(--warn-dim);border-color:rgba(251,191,36,0.25)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        </div>
        <h1 class="auth-title" style="font-size:18px;margin-bottom:8px">Link invalid or expired</h1>
        <p class="verify-note" style="margin-bottom:20px">
          This reset link is no longer valid. Request a new one and try again.
        </p>
        <a class="btn btn-primary btn-block" href="/forgot-password">Request a new link</a>
        <div class="verify-back">
          <a href="/">Back to Sign in</a>
        </div>
      </div>
    </main>

    <footer class="auth-foot">
      <span class="auth-foot-secure">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
        Your data stays with your providers
      </span>
    </footer>
  </div>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="/vendor/supabase.js"></script>
  <script src="/js/auth-utils.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
